# Render (render.com) blueprint: one web service built from the Dockerfile.
# Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: zunterview
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/var
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AI_DAILY_BUDGET_USD
        value: "10"
      - key: AI_CALLS_PER_IP_PER_DAY
        value: "120"
      - key: TTS_CHARS_PER_IP_PER_DAY
        value: "8000"
      - key: TYPECAST_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
