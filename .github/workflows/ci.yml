name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint → typecheck → unit tests → data validation → production build
      - run: npm run qa
